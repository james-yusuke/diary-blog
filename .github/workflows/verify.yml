name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - name: Generate templ components
        run: go tool templ generate
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
