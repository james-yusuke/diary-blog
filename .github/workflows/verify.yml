name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Clone private Zenn content
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ZENN_REPO_TOKEN: ${{ secrets.ZENN_REPO_TOKEN }}
        run: |
          if [ -z "$ZENN_REPO_TOKEN" ]; then
            echo "ZENN_REPO_TOKEN is not configured; skipping private submodule checkout."
            exit 0
          fi
          git clone --depth=1 "https://x-access-token:${ZENN_REPO_TOKEN}@github.com/james-yusuke/zenn.git" content/zenn
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - name: Generate templ components
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Verify generated Worker content
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ZENN_REPO_TOKEN: ${{ secrets.ZENN_REPO_TOKEN }}
        run: |
          if [ -z "$ZENN_REPO_TOKEN" ]; then
            echo "ZENN_REPO_TOKEN is not configured; skipping private content generation check."
            exit 0
          fi
          go run ./cmd/workergen
          git diff --exit-code -- internal/content/embedded_tinygo_gen.go internal/site/assets_tinygo_gen.go
