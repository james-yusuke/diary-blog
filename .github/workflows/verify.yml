name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secrets are unavailable to fork PRs, so those runs use fixture tests.
          submodules: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          # Fine-grained PAT: access is restricted to james-yusuke/zenn only.
          token: ${{ secrets.ZENN_REPO_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - name: Generate templ components
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Verify generated Worker content
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          go run ./cmd/workergen
          git diff --exit-code -- internal/content/embedded_tinygo_gen.go internal/site/assets_tinygo_gen.go
