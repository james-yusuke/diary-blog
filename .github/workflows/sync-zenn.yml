name: Sync Zenn content

on:
  workflow_dispatch:
    inputs:
      zenn_sha:
        description: "Zenn の同期対象コミットSHA（空なら main の最新）"
        required: false
        type: string
  # 通知失敗時の保険。通常の同期は Zenn の push 通知で即時に実行される。
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-zenn-content
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"

      - name: Clone requested private Zenn revision
        env:
          ZENN_REPO_TOKEN: ${{ secrets.ZENN_REPO_TOKEN }}
          ZENN_SHA: ${{ github.event.inputs.zenn_sha || '' }}
        run: |
          if [ -z "$ZENN_REPO_TOKEN" ]; then
            echo "ZENN_REPO_TOKEN must be configured to sync private Zenn content." >&2
            exit 1
          fi

          repo_url="https://x-access-token:${ZENN_REPO_TOKEN}@github.com/james-yusuke/zenn.git"
          if [ -z "$ZENN_SHA" ]; then
            git clone --depth=1 "$repo_url" content/zenn
            exit 0
          fi

          if ! printf '%s' "$ZENN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "zenn_sha must be a full lowercase Git commit SHA." >&2
            exit 1
          fi

          git init content/zenn
          git -C content/zenn remote add origin "$repo_url"
          git -C content/zenn fetch --depth=1 origin "$ZENN_SHA"
          git -C content/zenn checkout --detach FETCH_HEAD

          actual_sha="$(git -C content/zenn rev-parse HEAD)"
          if [ "$actual_sha" != "$ZENN_SHA" ]; then
            echo "Fetched Zenn revision does not match requested SHA." >&2
            exit 1
          fi

      - name: Audit Zenn article coverage
        run: go run ./cmd/zenncheck

      - name: Generate Worker content snapshot
        run: go run ./cmd/workergen

      - name: Commit updated Zenn snapshot
        run: |
          if git diff --quiet -- internal/content/embedded_tinygo_gen.go; then
            echo "Zenn content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/content/embedded_tinygo_gen.go
          git commit -m "chore: sync Zenn content"
          git push
